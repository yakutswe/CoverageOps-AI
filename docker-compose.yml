
services:
  db:
    image: postgres:17
    container_name: agent-lab-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: agentlab
      POSTGRES_USER: agentlab
      POSTGRES_PASSWORD: agentlab_dev_only

    ports:
      - "127.0.0.1:5545:5432"

    volumes:
      - agentlab_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U agentlab -d agentlab
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agentlab_postgres_data: